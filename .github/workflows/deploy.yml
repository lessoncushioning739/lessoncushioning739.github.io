name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          AA23D0: ${{ secrets.AA23D0 }}
          B5C7AB: ${{ secrets.B5C7AB }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('AA23D0', '')
          meta_b = os.environ.get('B5C7AB', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 7d84da6dccd8b047206a37e9f079 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 8204d6473992c4182350c70c79b8 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
